# Every example must run and print exactly what its recorded .out file says — and
# every lesson page's generated output block must match that run.
#
# Runs on Ubuntu AND macOS on purpose. Half the subject of this library is
# behaviour that depends on the platform's locale and console encoding, so a
# single-OS check would miss exactly the class of bug the library is about.

name: examples

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: java -version
      # --check writes nothing: it fails if any example's output has drifted from
      # its recorded key, or if any lesson page's generated block is stale.
      - run: python3 tools/run_examples.py --check
